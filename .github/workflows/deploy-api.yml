name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build Server
        run: npm run build

      - name: Upload to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/*"
          target: /var/www/blackbridge/
          rm: true

      - name: Redeploy server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ENV_FILE="/home/ec2-user/blackbridge-api.env"
            APP_DIR="/var/www/blackbridge/backend"
            APP_NAME="blackbridge-api"
            APP_ENTRY="dist/index.js"
            cd "$APP_DIR"
            cp "$ENV_FILE" .env
            echo "Running database migrations..."
            npm run prisma:migrate
            if pm2 list | grep -q "$APP_NAME"; then
              echo "Reloading $APP_NAME..."
              pm2 reload "$APP_NAME"
            else
              echo "Starting $APP_NAME..."
              pm2 start "$APP_ENTRY" --name "$APP_NAME" --env "$ENV_FILE"
              pm2 startup systemd || true
              pm2 save || true
            fi
            echo "Deployment complete."

